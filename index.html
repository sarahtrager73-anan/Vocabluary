box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--card:#1b212b;--ink:#eef0f4;--mute:#9aa3b2;--line:#2c3441;--acc:#7fa6ee;--acc2:#101622;--ok:#5ccf93;--bad:#ff8b80}}
:root[data-theme="dark"]{--bg:#12161d;--card:#1b212b;--ink:#eef0f4;--mute:#9aa3b2;--line:#2c3441;--acc:#7fa6ee;--acc2:#101622;--ok:#5ccf93;--bad:#ff8b80}
:root.es{--acc:#a8342c}
@media (prefers-color-scheme:dark){:root.es:not([data-theme="light"]){--acc:#ff8f7f}}
:root[data-theme="dark"].es{--acc:#ff8f7f}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1{font:600 1.35rem "Newsreader",Georgia,serif;margin:0}
.streak{font-size:.9rem;color:var(--mute)}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.tab{padding:10px 8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer;text-align:left}
.tab b{display:block;font-size:.95rem}.tab span{font-size:.8rem;color:var(--mute)}
.tab[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mute);margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:280px;padding:28px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;width:100%;color:var(--ink);font:inherit}
.word{font:600 2.2rem/1.15 "Newsreader",Georgia,serif;margin:0 0 8px;overflow-wrap:anywhere}
.hint{color:var(--mute);font-size:.9rem}
.tr{font-size:1.4rem;font-weight:600;color:var(--acc);margin:0 0 14px}
.ex{font:italic 1.05rem/1.5 "Newsreader",Georgia,serif;margin:0;max-width:40ch}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 1rem system-ui,sans-serif;cursor:pointer}
.btn.ok{background:var(--acc);color:var(--acc2);border-color:var(--acc)}
.btn:disabled{opacity:.4;cursor:default}
.speak{margin-top:16px;background:none;border:0;color:var(--acc);font:inherit;cursor:pointer;text-decoration:underline;padding:4px}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.done{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px;text-align:center}
.done h2{font:600 1.6rem "Newsreader",Georgia,serif;margin:0 0 8px}
.stats{display:flex;justify-content:space-around;margin:18px 0}
.stats b{display:block;font-size:1.5rem}.stats span{font-size:.8rem;color:var(--mute)}
textarea{width:100%;margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}.fb{min-height:1.4em;margin:10px 0 0;font-size:.9rem;color:var(--bad)}.fb.good{color:var(--ok)}
:root.de{--acc:#2d6a4f}@media (prefers-color-scheme:dark){:root.de:not([data-theme="light"]){--acc:#6fd0a0}}:root[data-theme="dark"].de{--acc:#6fd0a0}
select{max-width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.nav{display:flex;gap:6px;margin-bottom:14px}.nav button{flex:1;padding:8px;border:0;border-bottom:2px solid var(--line);background:none;color:var(--mute);font:inherit;cursor:pointer}.nav button[aria-pressed="true"]{border-color:var(--acc);color:var(--ink);font-weight:600}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.foot{margin-top:22px;font-size:.8rem;color:var(--mute);text-align:center}
.foot button{background:none;border:0;color:var(--mute);text-decoration:underline;font:inherit;cursor:pointer}
</style>
</head>

ermitteln\nevaluieren|bewerten, auswerten\ndifferenzieren|unterscheiden, aufgliedern\npostulieren|fordern, als gegeben annehmen\nakzentuieren|hervorheben, betonen\nrekurrieren|zurückgreifen, sich beziehen\nimplizieren|beinhalten, nach sich ziehen\nperpetuieren|fortdauern lassen, verstetigen\nnivellieren|angleichen, einebnen\ntangieren|berühren, betreffen\nkontrastieren|gegenüberstellen, abheben\nsubsumieren|einordnen, zusammenfassen\neklatant|offenkundig, auffallend\nvehement|heftig, nachdrücklich\nprekär|heikel, bedenklich\nobligat|unerlässlich, verpflichtend\nvage|unbestimmt, ungenau\narbiträr|willkürlich, beliebig\npragmatisch|sachbezogen, lösungsorientiert\nrepräsentativ|stellvertretend, aussagekräftig\ndezidiert|entschieden, bestimmt\nkursorisch|flüchtig, überblicksartig\nsukzessive|nach und nach, schrittweise\nsimultan|gleichzeitig"};
Object.keys(X2).forEach(function(l){X2[l].split("\n").forEach(function(r){var a=r.split("|");DATA[l].push([a[0],a[1]])})});
var LOCALE={en:"en-GB",es:"es-ES",de:"de-DE"};
var S={lang:"en",prog:{en:{},es:{}},streak:0,last:"",today:{}};
var queue=[],flipped=false,seen=0,total=0,sessionIdx=[],practice=null,view="learn";
function pad(n){return String(n).padStart(2,"0")}
function key(off){var d=new Date(Date.now()+(off||0)*864e5);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function load(){try{var r=localStorage.getItem("vocab-v1");if(r){var o=JSON.parse(r);if(o&&o.prog)S=Object.assign(S,o)}}catch(e){}}
function save(){try{localStorage.setItem("vocab-v1",JSON.stringify(S))}catch(e){}}
function build(){
 var p=S.prog[S.lang],t=key(),due=[],fresh=[];
 DATA[S.lang].forEach(function(w,i){var q=p[i];if(q){if(q.d<=t)due.push(i)}else fresh.push(i)});
 var done=(S.today[S.lang]&&S.today[S.lang].date===t)?S.today[S.lang].fresh:0;
 var left=Math.max(0,NEW_PER_DAY-done);
 queue=due.concat(fresh.slice(0,left));
 total=queue.length;seen=0;flipped=false;sessionIdx=[];practice=null;
}
function answer(ok){
 var i=queue.shift(),p=S.prog[S.lang],t=key(),q=p[i],isNew=!q;if(sessionIdx.indexOf(i)<0)sessionIdx.push(i);
 if(!q)q=p[i]={b:0,d:t};
 if(ok){q.b=Math.min(q.b+1,5);q.d=key(INTERVALS[q.b])}
 else{q.b=0;q.d=key(1);queue.push(i);total++}
 if(isNew){var td=S.today[S.lang];if(!td||td.date!==t)td=S.today[S.lang]={date:t,fresh:0};td.fresh++}
 if(S.last!==t){S.streak=(S.last===key(-1))?S.streak+1:1;S.last=t}
 seen++;flipped=false;save();render();
}
function pickVoice(l){var v=speechSynthesis.getVoices(),a=l.toLowerCase(),c=(S.voice||{})[S.lang],m=v.filter(function(x){return x.name===c})[0];if(m)return m;return v.filter(function(x){return x.lang.replace("_","-").toLowerCase()===a})[0]||v.filter(function(x){return x.lang.toLowerCase().indexOf(a.slice(0,2))===0})[0]}
function speak(text){try{var u=new SpeechSynthesisUtterance(text),v=pickVoice(LOCALE[S.lang]);u.lang=LOCALE[S.lang];if(v)u.voice=v;u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function fillVoices(){var s=document.getElementById("vsel");if(!s)return;var pre=LOCALE[S.lang].slice(0,2),list=[];try{list=speechSynthesis.getVoices().filter(function(x){return x.lang.toLowerCase().indexOf(pre)===0})}catch(e){}
 s.innerHTML=list.length?"":"<option>Keine Stimme gefunden</option>";
 list.forEach(function(v){var o=document.createElement("option");o.value=v.name;o.textContent=v.name+" ("+v.lang+")";s.appendChild(o)});
 var cur=(S.voice||{})[S.lang];if(cur&&list.some(function(v){return v.name===cur}))s.value=cur}
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=function(){fillVoices()}}catch(e){}
document.getElementById("vsel").onchange=function(){S.voice=S.voice||{};S.voice[S.lang]=this.value;save();speak(DATA[S.lang][0][0])};
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function render(){
 document.documentElement.classList.toggle("es",S.lang==="es");document.documentElement.classList.toggle("de",S.lang==="de");
 document.getElementById("t-en").setAttribute("aria-pressed",S.lang==="en");
 document.getElementById("t-es").setAttribute("aria-pressed",S.lang==="es");
 document.getElementById("t-de").setAttribute("aria-pressed",S.lang==="de");
 document.getElementById("streak").textContent=S.streak>0?"Serie: "+S.streak+(S.streak===1?" Tag":" Tage"):"";
 updateNav();if(practice){renderPractice();return}if(view!=="learn"){renderView();return}var el=document.getElementById("app"),p=S.prog[S.lang];
 if(!queue.length){
  var all=DATA[S.lang].length,learned=0,master=0;
  Object.keys(p).forEach(function(k){learned++;if(p[k].b>=4)master++});
  el.innerHTML='<div class="done"><h2>'+(total?"Tagesziel geschafft":"Heute nichts mehr fällig")+'</h2><p class="hint">'+(total?"Morgen warten neue Wörter und Wiederholungen auf dich.":"Komm morgen wieder oder wechsle die Sprache.")+'</p><div class="stats"><div><b>'+learned+'</b><span>gelernt</span></div><div><b>'+master+'</b><span>sicher (Stufe 4+)</span></div><div><b>'+(all-learned)+'</b><span>noch neu</span></div></div>'+(sessionIdx.length?'<button class="btn ok" id="pr" style="width:100%">Satzübung starten</button>':'')+'</div>';
  return;
 }
 var w=DATA[S.lang][queue[0]],isNew=!p[queue[0]];
 var pct=total?Math.round(seen/total*100):0;
 var h='<div class="bar"><i style="width:'+pct+'%"></i></div><div class="meta"><span>'+seen+" von "+total+'</span><span>'+(isNew?"Neues Wort":"Wiederholung")+'</span></div>';
 h+='<button class="card" id="card" aria-label="Karte umdrehen"><p class="word">'+esc(w[0])+'</p>';
 h+=flipped?'<p class="tr">'+esc(w[1])+'</p>'+(w[2]?'<p class="ex">'+esc(w[2])+'</p>':''):'<p class="hint">Tippen, um die Bedeutung zu sehen</p>';
 h+='</button><div class="row"><button class="btn" id="no"'+(flipped?"":" disabled")+'>Nochmal</button><button class="btn ok" id="yes"'+(flipped?"":" disabled")+'>Gewusst</button></div>';
 h+='<div style="text-align:center"><button class="speak" id="sp">Wort anhören</button> <button class="speak" id="sv">'+(isSaved(queue[0])?"Gemerkt":"Merken")+'</button>'+(flipped&&w[2]?' <button class="speak" id="sp2">Beispielsatz anhören</button>':'')+'</div>';
 el.innerHTML=h;
 document.getElementById("card").onclick=function(){flipped=!flipped;if(flipped)speak(w[0]);render()};
 document.getElementById("sp").onclick=function(){speak(w[0])};var s2=document.getElementById("sp2");if(s2)s2.onclick=function(){speak(w[2])};
 document.getElementById("no").onclick=function(){answer(false)};
 document.getElementById("yes").onclick=function(){answer(true)};
}
function norm(x){return x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function stem(w){var best="";norm(w).split(" ").forEach(function(t){t=t.replace(/[^a-z]/g,"");if(t.length<4)return;t=t.replace(/se$/,"");t=t.length>5?t.slice(0,t.length-2):t.length>3?t.slice(0,t.length-1):t;if(t.length>best.length)best=t});return best||norm(w).split(" ").pop().replace(/[^a-z]/g,"")}
function renderPractice(){
 var el=document.getElementById("app"),P=practice,n=P.list.length;
 if(P.i>=n){el.innerHTML='<div class="done"><h2>Übung beendet</h2><p class="hint">'+P.ok+" von "+n+' Sätzen enthielten das Zielwort.</p><button class="btn ok" id="px" style="width:100%;margin-top:14px">Zurück</button></div>';return}
 var w=DATA[S.lang][P.list[P.i]],h='<div class="bar"><i style="width:'+Math.round(P.i/n*100)+'%"></i></div><div class="meta"><span>Satzübung '+(P.i+1)+" von "+n+'</span><span>Eigener Satz</span></div><div class="done"><p class="word">'+esc(w[0])+'</p><p class="hint">'+esc(w[1])+"</p>";
 if(P.phase==="w"){h+='<textarea id="sent" rows="3" aria-label="Dein Satz"></textarea><p class="fb">'+P.msg+'</p><div class="row"><button class="btn" id="pskip">Überspringen</button><button class="btn ok" id="pchk">Prüfen</button></div>'}
 else{h+='<p class="ex">„'+esc(P.draft)+'“</p><p class="fb good">Gut, das Zielwort ist enthalten.</p>'+(w[2]?'<p class="hint">Zum Vergleich:</p><p class="ex">'+esc(w[2])+"</p>":"")+'<button class="btn ok" id="pnext" style="width:100%;margin-top:14px">Weiter</button>'}
 el.innerHTML=h+"</div>";
 var t=document.getElementById("sent");if(t){t.value=P.draft||"";t.focus()}
}
document.getElementById("app").addEventListener("click",function(e){var id=e.target.id,P=practice;
 if(id==="pr"){practice={list:sessionIdx.slice(0,10),i:0,ok:0,phase:"w",msg:"",draft:""};render();return}
 if(!P)return;
 if(id==="px"){practice=null;render()}
 else if(id==="pskip"||id==="pnext"){P.i++;P.phase="w";P.msg="";P.draft="";render()}
 else if(id==="pchk"){var s=document.getElementById("sent").value.trim(),w=DATA[S.lang][P.list[P.i]];P.draft=s;
  if(s.split(" ").filter(Boolean).length<4)P.msg="Schreibe einen ganzen Satz mit mindestens 4 Wörtern.";
  else if(norm(s).indexOf(stem(w[0]))<0)P.msg="Das Wort „"+w[0]+"“ kommt in deinem Satz nicht vor. Versuche es noch einmal.";
  else{P.ok++;P.phase="r";P.msg=""}
  render()}});
function updateNav(){["learn","prac","saved"].forEach(function(k){document.getElementById("n-"+k).setAttribute("aria-pressed",view===k)})}
function learnedList(){return Object.keys(S.prog[S.lang]).map(Number)}
function savedList(){return(S.saved&&S.saved[S.lang])||[]}
function isSaved(i){return savedList().indexOf(i)>=0}
function toggleSave(i){S.saved=S.saved||{};var l=S.saved[S.lang]=S.saved[S.lang]||[],k=l.indexOf(i);if(k<0)l.push(i);else l.splice(k,1);save();render()}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function renderView(){
 var el=document.getElementById("app"),L=learnedList(),sv=savedList(),h;
 if(view==="prac"){
  h='<div class="done"><h2>Übung wiederholen</h2><p class="hint">Bilde eigene Sätze mit Wörtern, die du schon kennst.</p><div class="row" style="grid-template-columns:1fr">';
  h+='<button class="btn ok" id="pr-rand"'+(L.length?"":" disabled")+'>10 zufällige gelernte Wörter ('+L.length+' verfügbar)</button>';
  h+='<button class="btn" id="pr-today"'+(sessionIdx.length?"":" disabled")+'>Wörter von heute ('+sessionIdx.length+')</button>';
  h+='<button class="btn" id="pr-saved"'+(sv.length?"":" disabled")+'>Meine Merkliste ('+sv.length+')</button></div></div>';
 }else{
  h='<div class="done" style="text-align:left"><h2 style="text-align:center">Merkliste</h2>';
  if(!sv.length)h+='<p class="hint" style="text-align:center">Noch leer. Tippe beim Lernen auf „Merken“.</p>';
  sv.forEach(function(i){var w=DATA[S.lang][i];h+='<div class="srow"><div><b>'+esc(w[0])+'</b><br><span class="hint">'+esc(w[1])+'</span></div><div><button class="speak" data-a="say" data-i="'+i+'">Anhören</button><button class="speak" data-a="rm" data-i="'+i+'">Entfernen</button></div></div>'});
  h+='</div>';
 }
 el.innerHTML=h;
}
document.getElementById("app").addEventListener("click",function(e){var t=e.target,id=t.id,a=t.dataset&&t.dataset.a;
 var go=function(l){if(l.length)practice={list:shuffle(l).slice(0,10),i:0,ok:0,phase:"w",msg:"",draft:""};render()};
 if(id==="pr-rand")go(learnedList());
 else if(id==="pr-today")go(sessionIdx);
 else if(id==="pr-saved")go(savedList());
 else if(id==="sv")toggleSave(queue[0]);
 else if(a==="say")speak(DATA[S.lang][+t.dataset.i][0]);
 else if(a==="rm")toggleSave(+t.dataset.i)});
["learn","prac","saved"].forEach(function(k){document.getElementById("n-"+k).onclick=function(){view=k;practice=null;render()}});
function setLang(l){S.lang=l;save();build();render();fillVoices()}
document.getElementById("t-en").onclick=function(){setLang("en")};
document.getElementById("t-es").onclick=function(){setLang("es")};
document.getElementById("t-de").onclick=function(){setLang("de")};
document.getElementById("reset").onclick=function(){if(confirm("Gesamten Fortschritt löschen?")){S={lang:S.lang,prog:{en:{},es:{},de:{}},streak:0,last:"",today:{}};save();build();render()}};
load();S.prog.de=S.prog.de||{};build();render();fillVoices();
</script>
